# Offline installs use the bundled rootfs. When the network is available,
# update the target from the official Arch mirrors before the bootloader runs.
# The leading "-" makes a failed update non-fatal.
dontChroot: false
timeout: 900
script:
  - "-/bin/bash -c 'getent hosts archlinux.org >/dev/null 2>&1 && pacman -Syu --noconfirm'"
