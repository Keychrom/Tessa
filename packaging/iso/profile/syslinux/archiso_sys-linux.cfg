LABEL tessa
TEXT HELP
Boot the Tessa Linux live desktop.
Tessa is a tiled Wayland desktop with an integrated panel and installer.
ENDTEXT
MENU LABEL Tessa Linux Live (BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%

LABEL tessa-software
TEXT HELP
Boot with software rendering when the GPU driver cannot create a renderer.
ENDTEXT
MENU LABEL Tessa Linux Live (BIOS, software rendering)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% tessa.software=1 %KERNEL_PARAMS%
