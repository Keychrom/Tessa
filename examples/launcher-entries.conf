# Additional launcher entries for Tessa.
#
# The panel reads this file when it is included from the main config:
#   include = /home/you/.config/tessa/launcher-entries.conf
# Use an absolute path (or a path relative to the including config);
# Tessa does not expand "~" in include paths.
#
# Format: launcher_entry = Name | command
# The command runs through /bin/sh when selected. A command may contain pipes.
launcher_entry = Notes | foot -e nvim ~/notes.md
launcher_entry = Lock screen | swaylock
