# Vermilion Ink theme package for Tessa.
#
# Copy this file next to your config and load it with:
#   theme = vermilion-ink.conf
#
# `theme` is an include alias. Editing this file triggers the config watcher
# (or press Super+R) without restarting the compositor.

theme-role = accent = #e2684f
theme-role = window.border.active = #e2684f
theme-role = window.border.inactive = #293347
theme-role = window.background = #0a0f1a
theme-role = panel.background = #0e1320
theme-role = panel.foreground = #eef2f8
theme-role = bar.background = #0e1320
theme-role = bar.foreground = #eef2f8
theme-role = launcher.background = #0d1220
theme-role = launcher.foreground = #eef2f8
theme-role = popover.background = #0d1220
theme-role = popover.foreground = #eef2f8
theme-role = toast.background = #0e1320
theme-role = toast.foreground = #eef2f8
theme-role = wallpaper.top = #162038
theme-role = wallpaper.bottom = #070a12
