# Sumi panel preset. Merge into ~/.config/tessa/panel.conf.
# Explicit theme-role / theme-colors.conf settings retain their normal precedence.
panel_style = unified
launcher_style = centered
font = Inter
bar_height = 48
bar_position = top
bar_top_margin = 16
bar_side_margin = 20
accent = #f08d72
panel_bg = #1a2329
panel_fg = #f0eee7
bar-bg = #1a2329
launcher-bg = #1a2329
popover-bg = #1a2329
toast-bg = #1a2329
bar-fg = #f0eee7
launcher-fg = #f0eee7
popover-fg = #f0eee7
toast-fg = #f0eee7
control_features = all
bar_overflow = true
